<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameArena | Neon Arena</title><style>
:root{color-scheme:dark;--bg:#080b1b;--panel:#151936;--stroke:#34395e;--blue:#45bfff;--purple:#ad6cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -10%,#372469 0%,transparent 46%),#090b1c;color:#f4f4ff;font:15px system-ui,'Segoe UI',sans-serif}button,input,select{font:inherit}button{border:0;border-radius:10px;background:linear-gradient(120deg,#7445e8,#338be8);color:white;padding:10px 17px;cursor:pointer;font-weight:700}button:hover{filter:brightness(1.15)}input,select{background:#0d1230;color:white;border:1px solid #43466f;border-radius:9px;padding:11px;width:100%}aside{width:224px;position:fixed;inset:0 auto 0 0;background:#0d1028;border-right:1px solid #282a4c;padding:24px 14px}aside h2{font-size:23px;letter-spacing:1px;margin:0 8px 32px;color:#c7a7ff}nav button{display:block;width:100%;margin:5px 0;text-align:left;background:transparent;color:#c5c9e7;font-weight:500}nav button.active,nav button:hover{background:#292251;color:white}main{margin-left:224px;padding:26px;max-width:1500px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.hero{background:linear-gradient(90deg,#0c0c26 5%,#10112b77 75%),url('/static/assets/hero.png') center/cover;min-height:265px;border:1px solid #5550a5;border-radius:20px;padding:35px;display:flex;flex-direction:column;justify-content:center;margin:22px 0}.hero h1{font-size:clamp(32px,5vw,58px);margin:0;text-shadow:0 3px 25px #050515}.hero p{max-width:540px;color:#e5ddff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:16px}.card{background:#151932dd;border:1px solid var(--stroke);border-radius:15px;padding:18px;overflow:hidden}.card img{width:100%;height:125px;object-fit:cover;border-radius:10px}.card h3{margin:12px 0 6px}.muted{color:#b1b6d5}.tag{font-size:12px;color:#a7dbff}.section{margin-top:26px}.section h2{font-size:22px}.hide{display:none!important}.form{display:grid;gap:10px;max-width:420px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input,.row select{flex:1;min-width:130px}.item{padding:13px 0;border-bottom:1px solid #34395e}.item:last-child{border:0}.notice{position:fixed;bottom:20px;right:20px;background:#2a2256;border:1px solid #8672d9;border-radius:10px;padding:14px;max-width:340px;display:none;z-index:5}#auth{background:#171936;padding:22px;border-radius:15px;border:1px solid #464474;max-width:480px}#auth .row{margin-top:12px}small{color:#aab0d3}@media(max-width:780px){aside{position:static;width:auto;padding:12px}aside h2{margin:4px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;width:auto}main{margin:0;padding:15px}.hero{min-height:210px;padding:20px}}
</style></head><body><aside><h2>⚡ GAMEARENA</h2><nav id="nav"></nav><small>NEON ARENA • WEB BETA</small></aside><main><div class="top"><div><span class="tag">PLATEFORME E-SPORT</span><h2 id="pageTitle">Accueil</h2></div><div class="row"><span id="identity" class="muted">Invité</span><button id="logout" class="hide" onclick="logout()">Déconnexion</button></div></div><div id="auth" class="section"><h2>Rejoins l'arène</h2><p class="muted">Connecte-toi ou crée un compte de test.</p><div class="form"><input id="username" placeholder="Pseudo" maxlength="24"><input id="password" placeholder="Mot de passe" type="password"><div class="row"><button onclick="login(false)">Connexion</button><button onclick="login(true)">Créer un compte</button></div></div></div><div id="content"></div></main><div id="notice" class="notice"></div><script>
const GAMES=['Fortnite','Rocket League','NHL','Call of Duty','Valorant','EA Sports FC','Minecraft'];let token=sessionStorage.getItem('ga_token')||'',me=null,section='Accueil';const tabs=['Accueil','Tournois','Classements','Amis','Équipes','Chat','Informations'];const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const msg=t=>{let n=$('notice');n.textContent=t;n.style.display='block';setTimeout(()=>n.style.display='none',4000)};async function api(path,method='GET',body){let r=await fetch('/api/'+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.error||'Erreur serveur');return d}async function login(create){try{let username=$('username').value,password=$('password').value;if(create)await api('register','POST',{username,password});let d=await api('login','POST',{username,password});token=d.token;sessionStorage.setItem('ga_token',token);await refresh()}catch(e){msg(e.message)}}async function logout(){try{await api('logout','POST')}catch(e){}token='';sessionStorage.removeItem('ga_token');me=null;refresh()}async function refresh(){if(token){try{me=await api('me')}catch(e){token='';sessionStorage.removeItem('ga_token');me=null}}$('auth').classList.toggle('hide',!!me);$('logout').classList.toggle('hide',!me);$('identity').textContent=me?me.username+' • '+me.points+' pts':'Invité';render()}function selectTab(s){section=s;render()}function render(){ $('pageTitle').textContent=section;$('nav').innerHTML=tabs.map(t=>`<button class="${section===t?'active':''}" onclick="selectTab('${t}')">${({Accueil:'⌂',Tournois:'🏆',Classements:'📊',Amis:'👥','Équipes':'🛡️',Chat:'💬',Informations:'📰'})[t]} ${t}</button>`).join('');let c=$('content');if(!me){c.innerHTML='<div class="hero"><h1>PLAY. COMPETE. WIN.</h1><p>Les tournois, les équipes et la compétition réunis au même endroit.</p></div>';return}c.innerHTML='<div class="card">Chargement…</div>';const pages={Accueil:home,Tournois:tournaments,Classements:rankings,Amis:friends,'Équipes':teams,Chat:chat,Informations:news};pages[section]().catch(e=>{c.innerHTML='<div class="card">'+esc(e.message)+'</div>'})}function put(h){$('content').innerHTML=h}async function home(){let d=await api('tournaments');put(`<div class="hero"><span class="tag">WELCOME TO THE ARENA</span><h1>TON ARÈNE.<br>TES RÈGLES.</h1><p>Crée ton tournoi, retrouve tes amis et grimpe au sommet du classement.</p><div><button onclick="selectTab('Tournois')">Explorer les tournois</button></div></div><h2>Bibliothèque de jeux</h2><div class="grid">${GAMES.map((g,i)=>`<div class="card"><img src="/static/assets/game_${i}.png" alt="Illustration ${esc(g)}"><h3>${esc(g)}</h3><span class="tag">TOURNOIS DISPONIBLES</span></div>`).join('')}</div><div class="section"><h2>Tournois récents</h2>${d.tournaments.slice(0,5).map(t=>`<div class="card item">🏆 ${esc(t.title)} • ${esc(t.game)} • ${t.joined}/${t.capacity}</div>`).join('')||'<p class="muted">Aucun tournoi pour le moment.</p>'}</div>`)}async function tournaments(){let d=await api('tournaments');put(`<div class="hero" style="min-height:170px"><h1>TOURNOIS</h1><p>Entre dans la compétition.</p></div><div class="card"><h3>Créer un tournoi</h3><div class="row"><input id="tt" placeholder="Nom du tournoi"><select id="tg">${GAMES.map(g=>`<option>${esc(g)}</option>`).join('')}</select><input id="tc" type="number" value="8" min="2" max="128" aria-label="Capacité"><button onclick="createTournament()">Créer</button></div></div><div class="section grid">${d.tournaments.map(t=>`<div class="card"><span class="tag">${esc(t.game)}</span><h3>${esc(t.title)}</h3><p class="muted">Organisé par ${esc(t.owner)} • ${t.joined}/${t.capacity} inscrits</p><div class="row"><button onclick="act('tournaments/${t.id}/join')">Rejoindre</button><button onclick="viewBracket(${t.id})">Tableau</button><button onclick="viewResults(${t.id})">Scores</button>${t.owner_id===me.id?`<button onclick="act('tournaments/${t.id}/start')">Démarrer</button>`:''}</div></div>`).join('')||'<p>Aucun tournoi.</p>'}</div><div id="details" class="section"></div>`)}async function createTournament(){try{await api('tournaments','POST',{title:$('tt').value,game:$('tg').value,capacity:Number($('tc').value)});msg('Tournoi créé');render()}catch(e){msg(e.message)}}async function act(path,data={}){try{await api(path,'POST',data);msg('Action réussie');render()}catch(e){msg(e.message)}}async function viewBracket(id){try{let d=await api(`tournaments/${id}/bracket`);$('details').innerHTML=`<div class="card"><h2>Tableau éliminatoire</h2>${(d.matches||[]).map(m=>`<div class="item">Manche ${m.round} • ${esc(m.player1_name||m.player1||'À déterminer')} VS ${esc(m.player2_name||m.player2||'À déterminer')} ${m.winner?' • Gagnant #'+m.winner:''}${m.id&&!m.winner?` <button onclick="report(${m.id})">Saisir score</button>`:''}</div>`).join('')||'Tournoi non démarré'}</div>`}catch(e){msg(e.message)}}async function report(id){let score1=prompt('Score joueur 1'),score2=prompt('Score joueur 2');if(score1===null||score2===null)return;await act('matches/'+id+'/report',{score1:Number(score1),score2:Number(score2)})}async function viewResults(id){try{let d=await api(`tournaments/${id}/results`);$('details').innerHTML=`<div class="card"><h2>Résultats</h2><div class="row"><input id="score" type="number" placeholder="Mon score"><button onclick="act('tournaments/${id}/results',{score:Number($('score').value)})">Soumettre</button></div>${d.results.map(r=>`<div class="item">${esc(r.username)} : ${r.score} • ${esc(r.status)} ${d.owner&&r.status==='pending'?`<button onclick="act('results/${r.id}/approve')">Valider</button>`:''}</div>`).join('')}</div>`}catch(e){msg(e.message)}}async function rankings(){let d=await api('rankings');put(`<h2>Classement mondial GameArena</h2><div class="card">${d.players.map((p,i)=>`<div class="item"><strong>${i+1}. ${esc(p.username)}</strong><span style="float:right;color:#a7dbff">${p.points} pts</span></div>`).join('')||'Aucun joueur'}</div>`)}async function friends(){let d=await api('friends');put(`<h2>Mes amis</h2><div class="card"><div class="row"><input id="friendname" placeholder="Pseudo d'un joueur"><button onclick="act('friends/request',{username:$('friendname').value})">Inviter</button></div>${d.friends.map(f=>`<div class="item">${esc(f.username)} • ${esc(f.status)} ${f.status==='pending'&&f.requested_by!==me.id?`<button onclick="act('friends/${f.other_id}/accept')">Accepter</button>`:''} ${f.status==='accepted'?`<button onclick="openDm(${f.other_id},'${esc(f.username)}')">Message privé</button>`:''}</div>`).join('')||'<p>Aucun ami.</p>'}</div><div id="details"></div>`)}async function openDm(id,name){let d=await api('dm/'+id);$('details').innerHTML=`<div class="card section"><h3>Conversation avec ${name}</h3>${d.messages.map(m=>`<div class="item"><b>${esc(m.sender)}</b> : ${esc(m.body)}</div>`).join('')}<div class="row"><input id="dmtext" placeholder="Ton message"><button onclick="act('dm/${id}',{body:$('dmtext').value})">Envoyer</button></div></div>`}async function teams(){let d=await api('teams');put(`<h2>Équipes e-sport</h2><div class="card row"><input id="teamname" placeholder="Nom de l'équipe"><button onclick="act('teams',{name:$('teamname').value})">Créer une équipe</button></div><div class="grid section">${d.teams.map(t=>`<div class="card"><h3>🛡️ ${esc(t.name)}</h3><p class="muted">Chef : ${esc(t.owner)} • ${t.members} membres</p><button onclick="act('teams/${t.id}/join')">Rejoindre</button></div>`).join('')}</div>`)}async function chat(){let d=await api('messages');put(`<h2>Chat communautaire</h2><div class="card">${d.messages.map(m=>`<div class="item"><strong>${esc(m.username)}</strong> : ${esc(m.body)}</div>`).join('')}<div class="row section"><input id="chattext" placeholder="Ton message"><button onclick="act('messages',{body:$('chattext').value})">Envoyer</button></div></div>`)}async function news(){put(`<div class="hero" style="background-image:linear-gradient(90deg,#090a20 10%,transparent),url('/static/assets/news.png')"><h1>INFORMATIONS</h1><p>Toutes les nouveautés de l'arène.</p></div><div class="grid"><div class="card"><h3>🏆 Tournois GameArena</h3><p>Crée un tournoi et invite les joueurs.</p></div><div class="card"><h3>👥 Rejoins une équipe</h3><p>Forme ton escouade avec tes amis.</p></div><div class="card"><h3>🚀 Version web bêta</h3><p>Cette plateforme est en cours de développement.</p></div></div>`)}refresh();
</script></body></html>
